name: ZenTao setup smoke tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Test calendar, configuration, and attachment helpers
        run: node --test tests/macos-config.test.mjs tests/work-calendar.test.mjs
      - name: Run cross-platform smoke checks
        shell: pwsh
        run: ./tests/zentao-smoke.ps1
